<script id="repository-content" type="application/json">{"topics":[{"id":"recursion","name":"Recursion","symbol":"()","parents":[],"language":"Python","updatedAt":"2026-10-29","body":"A recursive function solves one state by calling itself on smaller states. Before writing the calls, I need a precise sentence describing what one call returns or changes.\n\nFor `ways(k)`, the result is a count. For a subtree function, the result might be the root of a transformed subtree or a node found inside that subtree. Returning from a call resumes its caller; it does not stop the entire traversal.\n\n## State, base case, progress, combination\n\n- Define the input state and the meaning of the return value.\n- State what happens when the input is small enough to answer directly.\n- Make every recursive dependency move toward a base case.\n- Explain how returned values produce the answer for the current state.\n\nThis is the shape, not a requirement to use the same code for every problem:\n\n```python\ndef solve(state):\n    if is_base_case(state):\n        return base_result(state)\n\n    smaller_result = solve(smaller_state(state))\n    return combine(state, smaller_result)\n```\n\n`is_base_case`, `smaller_state`, and `combine` are placeholders. Their meanings must come from the problem. Some functions make several calls; some recurse for side effects and return nothing.\n\n## Calls and returned values are separate ideas\n\nEach call has its own frame and local variables. The caller keeps waiting while a child call runs. After that child returns, the caller continues from where it stopped.\n\nIn Python, for `solve(a) + solve(b)`, the left call finishes before the right call starts. The addition happens only after both values are available.\n\nThe objects referenced by frames can still be shared. A shared tree, dictionary, list, or visited set can be changed by several calls even though their local variables belong to different frames.\n\n## A call tree is not the call stack\n\nA call tree shows all calls made throughout execution. The stack contains only the currently active chain of calls.\n\nCount the total work across calls for time complexity. Measure the maximum number of simultaneous frames for stack space. These can grow at very different rates.\n\n- A recurrence such as `ways(n - 1) + ways(n - 2)` repeats overlapping states. Without caching, time is exponential but stack depth is O(n).\n- A tree traversal that visits each node once takes O(N) time, even if each node makes two recursive calls. Stack space is O(h), where h is the tree height; a skewed tree can have h = N.\n- Graph traversal needs cycle prevention. Marking each vertex before exploring its neighbors lets an adjacency-list DFS run in O(V + E) time.\n\nTwo recursive calls do not, by themselves, prove O(2^n) time. I need to identify the states, how much they overlap, and how many times they are processed.\n\n## Memoization and iteration\n\nMemoization helps when different paths ask for the answer to the same state. Define a key that captures the entire state and share the cache between calls.\n\nFor Climbing Stairs, the state is just the remaining stair count. There are O(n) distinct states. Caching gives O(n) time and O(n) auxiliary space including the stack.\n\nIf dependencies have a simple evaluation order, bottom-up iteration can remove the recursion. If only a few earlier answers remain necessary, I can then reduce the stored state. Climbing Stairs only needs two previous answers.\n\n## Interview phrasing\n\n\u003e For this call, the state is ___. The function returns ___. The base case is ___ because ___. Each recursive call makes progress by ___. Once those calls return, I combine their results by ___. To analyze the cost, I count ___ distinct states or nodes and ___ work per state. The deepest active chain is ___, so the auxiliary stack space is ___.\n\nI should fill these blanks with the current problem, not recite them without explaining the reasoning.\n"}],"problems":[{"id":"lc-70-climbing-stairs","number":"70","title":"Climbing Stairs","topics":["recursion","dp-1d"],"difficulty":"Easy","language":"Python","url":"https://leetcode.com/problems/climbing-stairs/","tags":"recursion, call stack, recurrence, memoization, dynamic programming","solvedAt":"2026-10-29","updatedAt":"2026-10-29","body":"My starting point is to make the two-step case explicit: one stair has one way, and two stairs have two ways, `[1, 1]` and `[2]`. These base cases make more sense to me than starting with zero stairs.\n\nThis is the recursive code I want to keep from my submission. The recurrence is correct, but the repeated work makes this version too slow for large inputs in the problem's range. It is my starting solution, not the optimized one.\n\n```python\nclass Solution:\n    def climbStairs(self, n: int) -\u003e int:\n        if n == 1:\n            return 1\n        if n == 2:\n            return 2\n\n        return self.climbStairs(n-1) + self.climbStairs(n-2)\n```\n\n## What the function actually returns\n\n`climbStairs(k)` returns the **number of distinct ways to reach stair k**. It does not return the number of stairs, move a person up the staircase, or build a list of paths.\n\nTo reach stair `k`, the final move must be one of two things:\n\n- A one-step move from stair `k - 1`.\n- A two-step move from stair `k - 2`.\n\nEvery way of reaching `k - 1` can be extended with one final step. Every way of reaching `k - 2` can be extended with one final two-step move. These groups cover all possibilities and cannot overlap because their final moves differ.\n\nThat gives the recurrence:\n\n```text\nways(k) = ways(k - 1) + ways(k - 2)\nways(1) = 1\nways(2) = 2\n```\n\nFor three stairs, the split is concrete:\n\n```text\nReach stair 2, then add 1:\n[1, 1] -\u003e [1, 1, 1]\n[2]    -\u003e [2, 1]\n\nReach stair 1, then add 2:\n[1]    -\u003e [1, 2]\n\n2 ways + 1 way = 3 ways\n```\n\n`[2, 1]` and `[1, 2]` are different sequences. Order matters.\n\n## How Python executes the recursion\n\nPython evaluates the left operand of `+` before the right one. A caller waits for both returned values before it can add them and return its own answer. Each call has its own local `n`; calling the method with `n - 1` does not change the caller's `n`.\n\nFor `n = 4`, this is the complete call tree for my two-base-case version:\n\n```text\nclimbStairs(4) = 5\n|-- climbStairs(3) = 3\n|   |-- climbStairs(2) = 2   [base case]\n|   `-- climbStairs(1) = 1   [base case]\n`-- climbStairs(2) = 2       [base case, called again]\n```\n\nThe execution order is:\n\n1. `climbStairs(4)` calls `climbStairs(3)` and waits.\n2. `climbStairs(3)` calls `climbStairs(2)`. That call returns `2` immediately.\n3. Back in `climbStairs(3)`, Python next calls `climbStairs(1)`, which returns `1`.\n4. `climbStairs(3)` adds `2 + 1` and returns `3` to the call for `4`.\n5. The call for `4` still needs its right-hand value. It calls `climbStairs(2)` again and gets `2`.\n6. It adds `3 + 2` and returns `5`.\n\nA base case stops **that call**, not the entire program. Execution resumes in the caller after the returned value is available. `self` is the same solution object throughout; the separate call frames hold the different values of `n`.\n\nAt `n = 5`, the repeated work is easier to see:\n\n```text\nways(5)\n|-- ways(4)\n|   |-- ways(3)\n|   |   |-- ways(2)\n|   |   `-- ways(1)\n|   `-- ways(2)\n`-- ways(3)                 \u003c- this whole subproblem is repeated\n    |-- ways(2)\n    `-- ways(1)\n```\n\nReturning a value does not automatically cache it. The second call to `ways(3)` repeats the same computation.\n\n## Why the zero-stair version also works\n\nThe alternative base cases `ways(0) = 1` and `ways(1) = 1` use a counting convention: there is one empty sequence of moves that reaches the starting position. For two stairs, that empty prefix followed by a two-step move accounts for `[2]`.\n\n```text\nways(2) = ways(1) + ways(0) = 1 + 1 = 2\n```\n\nZero is a helper state here; the problem's actual input starts at `n = 1`. Both definitions produce the same answers on valid inputs. I prefer explicitly naming the two possibilities at `n = 2`.\n\n## Time and space complexity of my recursive version\n\nFor the running time:\n\n```text\nT(n) = T(n - 1) + T(n - 2) + O(1)\n```\n\n- **Time: O(2^n)** is the usual interview upper bound. More tightly, the number of calls is **Theta(phi^n)**, where `phi = (1 + sqrt(5)) / 2`.\n- **Auxiliary space: O(n)** for the deepest chain of active recursive calls.\n\nThe total number of calls and the maximum number of simultaneous calls are different. The execution explores the tree depth first; it does not keep every node in memory at once. The longest chain decreases `n` by one until it reaches a base case.\n\nFor these exact base cases, the call count is `2 * Fib(n) - 1`, with `Fib(1) = Fib(2) = 1`. At `n = 44`, that is 1,402,817,465 calls. This explains the time limit issue without running that enormous recursion.\n\n## Keep the recursion, remove repeated work\n\nMemoization preserves the recurrence and the base cases. All recursive calls must share the same memo dictionary. A helper makes that sharing explicit.\n\n```python\nclass Solution:\n    def climbStairs(self, n: int) -\u003e int:\n        memo = {1: 1, 2: 2}\n\n        def ways(k: int) -\u003e int:\n            if k not in memo:\n                memo[k] = ways(k - 1) + ways(k - 2)\n            return memo[k]\n\n        return ways(n)\n```\n\nEach distinct state is expanded at most once. Reaching a previously computed state becomes a dictionary lookup. The dictionary belongs to the outer method call, so it is not recreated on every helper call.\n\n**Time: O(n). Auxiliary space: O(n)** for the memo and O(n) for the call stack, which is O(n) overall.\n\n## Compute the same states from the bottom up\n\nThere is no need to wait for recursive calls if the smaller answers are already available. An array makes the computation order visible:\n\n```python\nclass Solution:\n    def climbStairs(self, n: int) -\u003e int:\n        if n == 1:\n            return 1\n        if n == 2:\n            return 2\n\n        dp = [0] * (n + 1)\n        dp[1], dp[2] = 1, 2\n\n        for stair in range(3, n + 1):\n            dp[stair] = dp[stair - 1] + dp[stair - 2]\n\n        return dp[n]\n```\n\n**Time: O(n). Auxiliary space: O(n)** for the array. This version has no recursive call stack.\n\nOnly the previous two values are needed, so the array can be reduced to two variables. This is the iterative version from our discussion:\n\n```python\nclass Solution:\n    def climbStairs(self, n: int) -\u003e int:\n        one, two = 1, 1\n\n        for i in range(n-1):\n            temp = one\n            one = one + two\n            two = temp\n\n        return one\n```\n\nInitially, `one` represents `ways(1)` and `two` represents the helper state `ways(0)`. After each iteration, `one` advances to the next stair's answer and `two` keeps the previous answer.\n\n```text\nn = 5\n                         one                 two\nBefore the loop          1 = ways(1)         1 = ways(0)\nAfter iteration 1        2 = ways(2)         1 = ways(1)\nAfter iteration 2        3 = ways(3)         2 = ways(2)\nAfter iteration 3        5 = ways(4)         3 = ways(3)\nAfter iteration 4        8 = ways(5)         5 = ways(4)\n```\n\n`temp` preserves the old `one` before it is overwritten. Without it, assigning `two = one` after updating `one` would make both variables hold the new value.\n\nThe loop performs `n - 1` iterations. At `n = 44`, it runs 43 times rather than making over a billion calls. **Time: O(n). Auxiliary space: O(1)** in the usual interview model where arithmetic on these bounded values is constant time.\n\nI can also keep my preferred `1, 2` base cases in the constant-space version:\n\n```python\nclass Solution:\n    def climbStairs(self, n: int) -\u003e int:\n        if n \u003c= 2:\n            return n\n\n        previous, current = 1, 2\n        for stair in range(3, n + 1):\n            previous, current = current, previous + current\n        return current\n```\n\nPython evaluates the right-hand values before assigning either variable, so the simultaneous assignment keeps the old pair available.\n\nFast doubling or matrix exponentiation can compute `Fib(n + 1)` in O(log n) arithmetic steps. That is a further optimization for much larger `n`; for this problem's bound of 45, the O(n)-time, O(1)-auxiliary-space loop is the straightforward interview choice. A floating-point Fibonacci formula would introduce an avoidable rounding issue.\n\n## How I would explain this in an interview\n\n\u003e I want to define what a smaller subproblem means first. Let ways(k) be the number of ways to reach stair k. The last move into stair k is either one step from k minus one, or two steps from k minus two. Those cases are exhaustive and disjoint, so I add their counts. My base cases are one way for one stair and two ways for two stairs. Direct recursion expresses this correctly, but it repeats the same states, giving exponential time and linear stack space. I can cache each state to get linear time. Since each state only needs the previous two answers, I would finish with an iterative solution using linear time and constant auxiliary space.\n\nI should explain the state and why the cases can be added before walking through syntax. If asked how the recursion runs, I can trace `n = 4`, showing exactly where each caller waits and resumes. If asked to optimize, I can point to the repeated `ways(3)` subtree at `n = 5` rather than only naming dynamic programming.\n\nChecks I would say out loud:\n\n- `n = 1` returns `1`; `n = 2` returns `2`.\n- `n = 3` returns `3`, covering both orders of a one-step and two-step move.\n- `n = 4` returns `5`; `n = 5` returns `8`.\n- The optimized version handles `n = 45` and returns `1836311903`.\n\nReferences: [study conversation](https://chatgpt.com/share/6ae3ffab-4b10-83e8-bcda-53e1faf76729) and [LeetCode problem and constraints](https://leetcode.com/problems/climbing-stairs/). The first code block is the recursive version from my screenshot; the memoized and iterative variants are comparisons and improvements.\n"},{"id":"lc-226-invert-binary-tree","number":"226","title":"Invert Binary Tree","topics":["recursion","trees"],"difficulty":"Easy","language":"Python","url":"https://leetcode.com/problems/invert-binary-tree/","tags":"recursion, subtree contract, DFS, call stack","solvedAt":"2026-10-29","updatedAt":"2026-10-29","body":"For every node, its left and right subtrees need to exchange places. Swapping only the root's children is not enough: each subtree must also be inverted.\n\nThe shared discussion mentions this problem but does not include my submitted code. The implementation below is a reference for reviewing the recursion, not a copy of my submission.\n\n```python\nclass Solution:\n    def invertTree(self, root):\n        if root is None:\n            return None\n\n        inverted_left = self.invertTree(root.left)\n        inverted_right = self.invertTree(root.right)\n        root.left, root.right = inverted_right, inverted_left\n        return root\n```\n\n## What one call promises\n\n`invertTree(root)` returns the root of the inverted subtree that originally started at `root`.\n\nThe base case is an empty subtree. It is already inverted, so the function returns `None`. For a nonempty subtree, I can first obtain the inverted children, connect them on opposite sides, and return the current root.\n\nThis implementation changes the existing nodes. `return root` returns a reference to the same root object, whose children may now be different. It does not create a new root or return the root's value.\n\n## Follow the returned subtree roots\n\nConsider this tree:\n\n```text\n        4\n      /   \\\n     2     7\n    / \\   / \\\n   1   3 6   9\n```\n\nThe call for `4` waits while the call for `2` runs. The call for `2` first processes `1` and `3`. Each leaf calls the function on its two empty children, receives `None` twice, and returns itself.\n\nOnce the two child calls for `2` have returned, it reconnects `3` on the left and `1` on the right. It returns the root object `2` to the waiting call for `4`.\n\nThe same process turns the subtree at `7` into a subtree with children `9` and `6`. Finally, `4` receives both inverted subtree roots and connects them on opposite sides:\n\n```text\n        4\n      /   \\\n     7     2\n    / \\   / \\\n   9   6 3   1\n```\n\nThe two local names `inverted_left` and `inverted_right` make the return values explicit. They also prevent confusion about which child a later call is using while links are being changed.\n\n## Why this is correct\n\nAn empty subtree is unchanged. Assume both child calls return correctly inverted subtrees. Placing the inverted right subtree on the left and the inverted left subtree on the right then makes the entire current subtree its mirror. This argument applies from the leaves back up to the root.\n\nThe function must return the current root after the reconnection. Returning only one child would discard part of the tree from the result.\n\n## Time and space complexity\n\nLet `N` be the number of nodes and `h` the maximum number of nodes along a root-to-leaf path.\n\n- **Time: O(N)**. Every nonempty node is processed once and performs constant work beyond its child calls. The empty-child calls are also linear in number.\n- **Auxiliary space: O(h)** for the active recursion stack. This is O(log N) for a balanced tree and O(N) for a chain.\n- The nodes are reused, but that does not make the auxiliary space O(1). The stack still uses memory.\n\nThere are two recursive calls at each nonempty node, but their subtrees are disjoint. This is different from Climbing Stairs, where the same smaller state is recomputed through different branches. Memoization would add storage without removing repeated subtree work here.\n\n## An iterative alternative\n\nAn explicit stack avoids recursive calls. Swap a node's children, then arrange to process both children as well.\n\n```python\nclass Solution:\n    def invertTree(self, root):\n        if root is None:\n            return None\n\n        stack = [root]\n        while stack:\n            node = stack.pop()\n            node.left, node.right = node.right, node.left\n            if node.left is not None:\n                stack.append(node.left)\n            if node.right is not None:\n                stack.append(node.right)\n        return root\n```\n\nThis still takes O(N) time. The explicit DFS stack uses O(h) space as an upper bound, which can be O(N) over all tree shapes. Its size does not have to equal the recursive stack size for every particular tree.\n\nA BFS implementation instead stores a queue and uses O(w) space, where `w` is the maximum tree width. A wide tree can make that queue much larger than a balanced tree's recursive stack. Changing traversal order is not automatically a memory optimization.\n\n## How I would explain it in an interview\n\n\u003e I define the recursive function to return the root of an inverted subtree. An empty subtree returns None. For a real node, I invert both child subtrees, attach them on opposite sides, and return the current node. If the two recursive results are correct, this reconnection makes the current subtree correct too. Every node is processed once, so the time is linear. The extra space is the recursion depth: logarithmic for a balanced tree and linear for a skewed one. I can use an explicit stack if I want to avoid recursive calls, while keeping the same traversal work.\n\nI would check an empty tree, a single node, a node with only one child, and an asymmetric tree. Inverting twice should restore the original structure and keep the same node objects.\n\nReferences: [problem definition and examples](https://leetcode.com/problems/invert-binary-tree/) and [the study conversation that mentions this problem](https://chatgpt.com/share/6ae3ffab-4b10-83e8-bcda-53e1faf76729).\n"},{"id":"lc-236-lowest-common-ancestor","number":"236","title":"Lowest Common Ancestor of a Binary Tree","topics":["recursion","trees"],"difficulty":"Medium","language":"Python","url":"https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-tree/","tags":"recursion, return values, lowest common ancestor, DFS, parent pointers","solvedAt":"2026-10-29","updatedAt":"2026-10-29","body":"The lowest common ancestor is the deepest node whose subtree contains both targets. A target can be its own ancestor, so if `p` is above `q`, the answer can be `p` itself.\n\nThis is a general binary tree, not a binary search tree. I cannot choose a child by comparing node values.\n\nThe shared discussion mentions this problem but does not include my submitted code. This is a reference implementation for explaining the return values and comparing approaches.\n\n```python\nclass Solution:\n    def lowestCommonAncestor(self, root, p, q):\n        if root is None or root is p or root is q:\n            return root\n\n        left = self.lowestCommonAncestor(root.left, p, q)\n        right = self.lowestCommonAncestor(root.right, p, q)\n\n        if left is not None and right is not None:\n            return root\n        return left if left is not None else right\n```\n\n## What a returned node means\n\nThe return value is a signal about the subtree, not always the final answer for the entire tree.\n\n- `None`: neither target is in this subtree.\n- A target node: that target was found; it may also be the answer if the other target is below it.\n- Another node: both targets have been found, and this node is their lowest common ancestor within the subtree.\n\nEach caller uses the signals from its two children. If both are nonempty, the targets lie on opposite sides of the current node, so the current node is the answer. If only one is nonempty, the caller passes that node upward unchanged.\n\nThe comparisons use `is` because the inputs are node objects. Returning `root.val` would return the wrong kind of result.\n\n## Trace the split\n\nUse this tree:\n\n```text\n          3\n        /   \\\n       5     1\n      / \\   / \\\n     6   2 0   8\n        / \\\n       7   4\n```\n\nFor `p = node 7` and `q = node 4`:\n\n1. The call at `7` returns the target node `7`; the call at `4` returns `4`.\n2. The call at `2` receives a nonempty result from each side. It returns node `2`.\n3. The call at `5` gets `None` from the subtree at `6` and node `2` from its right subtree. It passes node `2` upward.\n4. The call at `3` gets node `2` from the left and `None` from the right subtree. It returns node `2`.\n\nThe ancestors do not replace an already found answer just because they are also common ancestors. Passing the nonempty child result upward preserves the lowest one.\n\nPython evaluates the left recursive call before the right one. Each parent waits for the two results before choosing what to return.\n\n## Why returning a target immediately is valid\n\nFor `p = node 5` and `q = node 4`, the call at `5` returns `5` immediately. It does not need to recurse below `5` to find `4` in this implementation.\n\nIf the other target is below this target, the target itself is already the lowest possible common ancestor. If the other target is elsewhere, the returned target becomes a signal for a higher caller to combine with the other side.\n\nThis reasoning relies on the problem's guarantee that **both distinct target nodes exist in the tree**. If one target could be absent, the same implementation could return the other target even though no valid two-target answer exists. That version of the problem needs additional presence tracking.\n\n## Time and space complexity\n\nLet `N` be the number of nodes and `h` the tree height measured in nodes along the deepest path.\n\n- **Worst-case time: O(N)**. A node is visited at most once. Early target returns may skip some subtrees, but the worst case still examines the tree.\n- **Auxiliary space: O(h)** for recursion. A balanced tree gives O(log N) stack depth; a skewed tree can require O(N).\n\nCaching does not improve this single-query traversal: it is not recomputing the same subtree through multiple paths.\n\nPython's recursion limit matters for a sufficiently deep tree. The problem permits up to 100,000 nodes, so the recursive version can fail with a recursion-depth error on a long chain even though its recurrence is correct. An iterative implementation handles that case without relying on a deeper Python call stack.\n\n## Iteration with parent references\n\nBuild parent references until both targets have been discovered. Then collect the ancestors of `p` and climb upward from `q`. The first node on `q`'s upward path that belongs to that set is the lowest shared ancestor.\n\n```python\nclass Solution:\n    def lowestCommonAncestor(self, root, p, q):\n        if root is None:\n            return None\n\n        parent = {root: None}\n        stack = [root]\n        while p not in parent or q not in parent:\n            node = stack.pop()\n            if node.left is not None:\n                parent[node.left] = node\n                stack.append(node.left)\n            if node.right is not None:\n                parent[node.right] = node\n                stack.append(node.right)\n\n        ancestors = set()\n        node = p\n        while node is not None:\n            ancestors.add(node)\n            node = parent[node]\n\n        node = q\n        while node not in ancestors:\n            node = parent[node]\n        return node\n```\n\nThis uses the same guarantee that both targets exist. **Time is O(N), auxiliary space is O(N)** for the parent references, traversal stack, and ancestor set. It removes the recursion-depth issue, at the cost of storing parent information even when the tree is balanced. It is not a faster asymptotic algorithm for a single query.\n\nFor many LCA queries on the same fixed tree, preprocessing depths and binary-lifting ancestors is a different tradeoff: O(N log N) preprocessing time and storage, then O(log N) per query. That extra structure is unnecessary for one query.\n\n## How I would explain it in an interview\n\n\u003e First I would confirm that both targets exist and that this is a general binary tree. Each recursive call returns a useful node from its subtree, or None if it finds neither target. If a node is one of the targets, I return it. Otherwise I collect the two child results. Two nonempty results mean the targets split across this node, so it is their lowest common ancestor. With only one result, I pass it upward. This visits each node at most once, giving linear worst-case time and O(h) stack space. For a deeply skewed tree in Python, I would use an iterative parent-reference approach to avoid the recursion limit, with O(N) extra storage.\n\nChecks I would explain:\n\n- Targets in opposite root subtrees: `5` and `1` return root `3`.\n- One target is the ancestor of the other: `5` and `4` return `5`.\n- Targets split deeper down: `7` and `4` return `2`, not `3`.\n- Targets in a long chain: use the iterative version when recursion depth is too large.\n- Return the actual node object, not its value.\n\nReferences: [problem definition, examples, and target-presence guarantee](https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-tree/) and [the study conversation that mentions this problem](https://chatgpt.com/share/6ae3ffab-4b10-83e8-bcda-53e1faf76729).\n"},{"id":"lc-2860-happy-students","number":"2860","title":"Happy Students","topics":["arrays"],"difficulty":"Medium","language":"Python","url":"https://leetcode.com/problems/happy-students/","tags":"sorting, enumeration, counting","solvedAt":"2026-11-03","updatedAt":"2026-11-03","body":"## Key idea\n\nTry every group size `s` from `0` to `n`. Student `i` is happy only if:\n\n- selected and `s \u003e nums[i]`, or\n- not selected and `s \u003c nums[i]`.\n\nIf `nums[i] == s`, that student can't be happy, so the size `s` fails. Otherwise each student's choice is forced: `nums[i] \u003c s` must be selected. So `s` works when exactly `s` students have `nums[i] \u003c s`.\n\n```text\n[1, 2, 3], s = 2\ni = 0   2 \u003e 1    -\u003e must be selected\ni = 1   2 == 2   -\u003e invalid either way, s = 2 fails\ni = 2   2 \u003c 3    -\u003e must not be selected\n```\n\n## Brute force: O(n^2)\n\n```python\nclass Solution:\n    def countWays(self, nums: List[int]) -\u003e int:\n        ans = 0\n        for s in range(len(nums) + 1):\n            valid = True\n            cnt = 0\n            for i in range(len(nums)):\n                if nums[i] == s:\n                    valid = False\n                elif nums[i] \u003c s:\n                    cnt += 1\n            if valid and cnt == s:\n                ans += 1\n        return ans\n```\n\n## Optimized: sort, O(n log n)\n\nAfter sorting, the selected group of size `s` has to be the `s` smallest values. So size `s` works when:\n\n```text\nnums[s-1] \u003c s \u003c nums[s]\n```\n\n- `s = 0`: nobody is selected, so the smallest value must be `\u003e 0`.\n- `s = n`: everyone is selected. This always works because `nums[i] \u003c n`.\n\n```python\nclass Solution:\n    def countWays(self, nums: List[int]) -\u003e int:\n        nums.sort()\n        ans = 0\n        n = len(nums)\n\n        for s in range(n + 1):\n            if s == 0:\n                if nums[0] \u003e 0:\n                    ans += 1\n            elif s == n:\n                ans += 1\n            elif nums[s-1] \u003c s and nums[s] \u003e s:\n                ans += 1\n\n        return ans\n```\n\n**Time: O(n log n)** for the sort. **Space: O(1)** extra, not counting the sort.\n\n## Remember\n\n- Fix the group size first, and each student's choice is forced.\n- Sorting means \"selected\" = a prefix of the sorted array.\n"}]}</script>

  const selectField=(name,label,values,current)=>`<label class="field"><span>${label}</span><select name="${name}">${values.map(v=>{const [key,text]=Array.isArray(v)?v:[v,v];return `<option value="${esc(key)}" ${key===current?'selected':''}>${esc(text)}</option>`;}).join('')}</select></label>`;
  function freeNoteEditor(body,language='Python') {
    return `<div class="free-note-workspace"><div class="notebook-toolbar" role="toolbar" aria-label="Formatting"><div class="editor-modes"><button type="button" class="active" data-action="note-write" aria-pressed="true">Write</button><button type="button" data-action="note-preview" aria-pressed="false">Preview</button></div><div class="format-tools"><button type="button" data-edit="heading" title="Heading">H₂</button><button type="button" data-edit="bold" title="Bold (⌘/Ctrl B)"><b>B</b></button><button type="button" data-edit="list" title="List">${icon('files')}</button><button type="button" data-edit="link" title="Link">${icon('external')}</button><span class="toolbar-separator"></span><select id="block-language" name="language" aria-label="Code block language">${langs.map(l=>`<option ${l===language?'selected':''}>${l}</option>`).join('')}</select><button type="button" data-edit="code" class="insert-code" title="Insert a code block at the cursor">${icon('code')} Insert code</button></div></div><div class="editor-surface"><textarea class="free-editor" name="body" id="note-body" aria-label="Note content" spellcheck="false" maxlength="1000000" >${esc(body||'')}</textarea><article id="note-preview" class="note-document editor-preview" hidden></article></div></div>`;
  }
  function problemEditor(id='',topic=''){
    const p=id?state.problems.find(x=>x.id===id):{number:'',title:'',body:'',difficulty:'',topics:topic?[topic]:[],language:state.preferences.language,solvedAt:today()};if(!p)return;
    openDialog(`<form id="problem-form" novalidate>${dialogHeader(id?'Edit problem':'New problem')}<div class="form-body notebook-form"><div class="field-error" role="alert"></div><input class="note-title-input" name="title" aria-label="Problem title" value="${esc(p.title)}" placeholder="Problem title" maxlength="200" autofocus><details class="note-metadata"><summary>Properties <span>optional</span></summary><div class="form-grid">${field('number','Problem number',p.number,{type:'number',min:'1',max:'9999999',placeholder:'e.g. 70'})}${selectField('difficulty','Difficulty',[['','Not set'],'Easy','Medium','Hard'],p.difficulty)}<div class="field full"><span>Topics</span><div class="check-list">${state.topics.map(t=>`<label class="check-chip"><input type="checkbox" name="topics" value="${esc(t.id)}" ${p.topics.includes(t.id)?'checked':''}>${esc(t.name)}</label>`).join('')}</div></div>${field('url','LeetCode URL',p.url,{full:true,type:'url',maxlength:2000,placeholder:'https://leetcode.com/problems/…'})}${field('solvedAt','Date',p.solvedAt,{type:'date'})}${field('tags','Tags',p.tags,{maxlength:500,placeholder:'Comma-separated tags'})}</div></details>${freeNoteEditor(p.body,p.language)}</div><div class="dialog-footer"><small></small><div class="button-row"><button type="button" class="btn" data-action="close-dialog">Cancel</button><button type="submit" class="btn primary">Save</button></div></div></form>`,'problem',id);
  }
  function topicEditor(id=''){
    const t=id?topicById(id):{name:'',symbol:'{}',body:'',language:state.preferences.language,parents:[]};if(!t)return;
    openDialog(`<form id="topic-form" novalidate>${dialogHeader(id?'Edit master note':'New topic')}<div class="form-body notebook-form"><div class="field-error" role="alert"></div><input class="note-title-input" name="name" aria-label="Topic name" value="${esc(t.name)}" placeholder="Topic name" maxlength="80" autofocus>${freeNoteEditor(t.body,t.language)}</div><div class="dialog-footer"><small></small><div class="button-row"><button type="button" class="btn" data-action="close-dialog">Cancel</button><button type="submit" class="btn primary">Save</button></div></div></form>`,'topic',id);
  }

  function noteMode(preview){
    const area=$('#note-body',editor),view=$('#note-preview',editor);if(!area||!view)return;
    area.hidden=preview;view.hidden=!preview;
    if(preview)view.innerHTML=area.value.trim()?renderNote(area.value,'preview').html:'';
    editor.querySelectorAll('.editor-modes button').forEach(b=>{const active=b.dataset.action===(preview?'note-preview':'note-write');b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
    editor.querySelector('.format-tools').hidden=preview;
    if(!preview)area.focus();
  }
  function insertNoteFormat(kind){
    const area=$('#note-body',editor);if(!area)return;
    const start=area.selectionStart,end=area.selectionEnd,selected=area.value.slice(start,end);
    let replacement='',caret=0;
    if(kind==='code'){
      const language=$('#block-language',editor).value;
      const runs=selected.match(/`+/g)||[],fence='`'.repeat(runs.reduce((n,s)=>Math.max(n,s.length+1),3));
      const before=start>0?(area.value.slice(0,start).endsWith('\n\n')?'':area.value[start-1]==='\n'?'\n':'\n\n'):'';
      const after=end<area.value.length?(area.value.slice(end).startsWith('\n\n')?'':area.value[end]==='\n'?'\n':'\n\n'):'\n\n';
      const prefix=before+fence+languageId(language)+'\n';replacement=prefix+selected+'\n'+fence+after;caret=prefix.length;
    }else if(kind==='bold'){replacement='**'+selected+'**';caret=2;}
    else if(kind==='link'){replacement='['+selected+'](https://)';caret=selected?selected.length+3:1;}
    else {const prefix=kind==='heading'?'## ':'- ',before=start>0&&area.value[start-1]!=='\n'?'\n':'';replacement=before+prefix+selected;caret=replacement.length;}
    area.setRangeText(replacement,start,end,'end');area.focus();
    if(kind==='code'||kind==='bold')area.setSelectionRange(start+caret,start+caret+selected.length);
    else area.setSelectionRange(start+caret,start+caret);
    editorDirty=true;
  }

  function closeDialog(force=false){if(editorDirty&&!force){confirmDialog('Discard unsaved changes?','You have unsaved changes. Cancel to keep editing or discard the changes.','Discard changes',()=>{editorDirty=false;editor.close();},true);return;}editor.close();editorDirty=false;}
  // Keep the editing form intact behind the confirmation dialog.
  function confirmDialog(title,text,label,onConfirm,danger=false){
    const confirm=document.createElement('dialog');confirm.className='confirm-dialog';confirm.setAttribute('aria-labelledby','confirm-title');confirm.style.maxWidth='450px';confirm.innerHTML=`<div class="dialog-header"><h2 id="confirm-title" style="font-size:18px">${esc(title)}</h2></div><div class="form-body"><p class="prose">${esc(text)}</p></div><div class="dialog-footer"><button class="btn" data-choice="cancel">Cancel</button><button class="btn ${danger?'danger':'primary'}" data-choice="confirm">${esc(label)}</button></div>`;document.body.append(confirm);confirm.showModal();confirm.querySelector('[data-choice="cancel"]').focus();confirm.addEventListener('click',e=>{const b=e.target.closest('[data-choice]');if(!b)return;confirm.close();confirm.remove();if(b.dataset.choice==='confirm')onConfirm();});confirm.addEventListener('cancel',()=>confirm.remove());
  }
  function errorOnForm(form,message){$('.field-error',form).textContent=message;$('.field-error',form).scrollIntoView({block:'center',behavior:'smooth'});}
  function saveProblem(form){
    const fd=new FormData(form),get=k=>String(fd.get(k)||'').trim(),topics=fd.getAll('topics');
    if(!get('title')){errorOnForm(form,'Enter a problem title.');return;}
    const duplicate=get('number')&&state.problems.find(p=>p.number&&+p.number===+get('number')&&p.id!==editingId);if(duplicate){errorOnForm(form,'This problem number already exists. Edit that note or leave the number blank for a separate note.');return;}
    if(get('url')&&!safeUrl(get('url'))){errorOnForm(form,'Use an http or https URL.');return;}
    const prev=state.problems.find(p=>p.id===editingId),id=editingId||uid('p');
    const p={id,number:get('number'),title:get('title'),topics,difficulty:get('difficulty'),language:get('language'),status:prev?.status||'solved',solvedAt:get('solvedAt'),url:get('url'),body:String(fd.get('body')??''),tags:get('tags'),reviewDate:prev?.reviewDate||'',starred:prev?.starred||false,reviewedAt:prev?.reviewedAt||'',updatedAt:new Date().toISOString()};
    try{if(!mutate(s=>{const at=s.problems.findIndex(x=>x.id===id);if(at<0)s.problems.push(p);else s.problems[at]=p;}))return;closeDialog(true);go('problem/'+id);render();toast('Problem note saved.');}catch(e){errorOnForm(form,e.message);}
  }
  function saveTopic(form){
    const fd=new FormData(form),get=k=>String(fd.get(k)||'').trim();if(!get('name')){errorOnForm(form,'Enter a topic name.');return;}
    if(state.topics.some(t=>t.id!==editingId&&t.name.toLowerCase()===get('name').toLowerCase())){errorOnForm(form,'A topic with this name already exists.');return;}
    const old=topicById(editingId),id=editingId||uid('t');const t={id,name:get('name'),symbol:old?.symbol||'{}',parents:old?.parents||[],language:get('language'),body:String(fd.get('body')??''),updatedAt:new Date().toISOString()};
    try{if(!mutate(s=>{const at=s.topics.findIndex(x=>x.id===id);if(at<0)s.topics.push(t);else s.topics[at]=t;}))return;closeDialog(true);topicTab='note';go('topic/'+id);render();toast('Master note saved.');}catch(e){errorOnForm(form,e.message);}
  }
  function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
  function exportJSON(){download(JSON.stringify(state,null,2),'application/json','leetcode-notes-'+today()+'.json');toast('JSON backup downloaded.');}
  function exportHTML(){
    const clone=document.documentElement.cloneNode(true);clone.dataset.notebookId=uid('notebook');
    clone.querySelector('#embedded-data').textContent=JSON.stringify(state).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');
    clone.querySelector('#app').innerHTML='';clone.querySelector('#editor').innerHTML='';clone.querySelector('#editor').removeAttribute('open');clone.querySelector('#toast').hidden=true;clone.querySelector('#toast').textContent='';clone.querySelectorAll('.confirm-dialog').forEach(e=>e.remove());
    download('<!doctype html>\n'+clone.outerHTML,'text/html;charset=utf-8','leetcode-notes-'+today()+'.html');toast('HTML file downloaded.');
  }
  async function copyCode(el){const text=el.closest('.code-box').querySelector('code').textContent;try{if(navigator.clipboard&&globalThis.isSecureContext)await navigator.clipboard.writeText(text);else {const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;opacity:0';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw Error('copy');}toast('Code copied.');}catch{toast('Copy is unavailable. Select the code and copy it manually.');}}
  function searchDialog(){searchQuery='';openDialog(`${dialogHeader('Search')}<input id="global-query" class="search-dialog-input" type="search" placeholder="Search problems and topics" aria-label="Search notes" autofocus><div id="global-results" class="search-results" aria-live="polite"></div>`,'search');updateSearch();}
  function updateSearch(){const q=searchQuery.trim().toLowerCase(),problems=state.problems.filter(p=>matches(p,q)),topics=state.topics.filter(t=>(t.name+' '+t.body).toLowerCase().includes(q));const results=[...problems.map(p=>({title:(p.number?p.number+'. ':'')+p.title,sub:'Problem · '+(p.topics.map(t=>topicById(t)?.name).join(', ')||'Uncategorized'),path:'problem/'+p.id})),...topics.map(t=>({title:t.name,sub:'Master note · '+problemsFor(t.id).length+' problems',path:'topic/'+t.id}))].slice(0,40);$('#global-results').innerHTML=!q?empty('Search your notes','Enter a title, problem number, or a phrase from your notes.'):results.length?results.map(r=>`<button class="search-result" data-action="search-go" data-path="${esc(r.path)}"><strong>${esc(r.title)}</strong><small>${esc(r.sub)}</small></button>`).join(''):empty('No results','Try a different search.');}
  function closeSidebar(){$('.sidebar')?.classList.remove('open');$('.mobile-overlay')?.classList.remove('open');}
  document.addEventListener('click',e=>{
    const format=e.target.closest('[data-edit]');if(format){insertNoteFormat(format.dataset.edit);return;}
    const scroll=e.target.closest('[data-scroll]');if(scroll){e.preventDefault();document.getElementById(scroll.dataset.scroll)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});return;}
    if(e.target.closest('.side-topic,.nav-link,.brand'))closeSidebar();
    const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,r=route();
    switch(action){
      case'add-problem':problemEditor();break;case'add-problem-topic':problemEditor('',r.id);break;case'edit-problem':problemEditor(r.id);break;
      case'add-topic':topicEditor();break;case'edit-topic':topicEditor(r.id);break;case'close-dialog':closeDialog();break;
      case'topic-note':topicTab='note';render();break;case'topic-problems':topicTab='problems';render();break;
      case'note-write':noteMode(false);break;case'note-preview':noteMode(true);break;
      case'copy-code':copyCode(el);break;case'backup':backupDialog();break;case'export-json':exportJSON();break;case'export-html':exportHTML();break;case'import-json':$('#import-file').click();break;
      case'clear-filters':filters={query:'',topic:'',difficulty:'',sort:'recent'};render();break;
      case'search':searchDialog();break;case'search-go':closeDialog(true);topicTab='note';go(el.dataset.path);break;
      case'delete-problem':confirmDialog('Delete problem note?','This removes the note and its content. Export a backup first if you want to keep a copy.','Delete',()=>{if(mutate(s=>s.problems=s.problems.filter(p=>p.id!==r.id))){go('problems');toast('Problem note deleted.');}},true);break;
      case'download-recovery':download(recoveryRaw,'application/json','leetcode-notes-recovery-'+today()+'.json');confirmDialog('Start with empty notes?','The original data has been downloaded. Keep that file before starting with empty notes.','Start over',()=>{recoveryRaw='';save(freshState());closeDialog(true);go('problems');render();});break;
      case'print':window.print();break;case'menu':$('.sidebar').classList.add('open');$('.mobile-overlay').classList.add('open');break;case'close-menu':closeSidebar();break;
    }
  });
  document.addEventListener('input',e=>{const el=e.target;if(editor.contains(el)&&editorType!=='search')editorDirty=true;if(el.id==='problem-query'){filters.query=el.value;updateProblemResults();}if(el.id==='topic-query'){topicQuery=el.value;updateTopics();}if(el.id==='global-query'){searchQuery=el.value;updateSearch();}});
  document.addEventListener('change',e=>{const el=e.target,keys={'filter-topic':'topic','filter-difficulty':'difficulty','filter-sort':'sort'};if(keys[el.id]){filters[keys[el.id]]=el.value;updateProblemResults();}});
  document.addEventListener('submit',e=>{if(e.target.id==='problem-form'){e.preventDefault();saveProblem(e.target);}if(e.target.id==='topic-form'){e.preventDefault();saveTopic(e.target);}});
  editor.addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
  document.addEventListener('keydown',e=>{
    const modifier=e.metaKey||e.ctrlKey;
    if(modifier&&e.key.toLowerCase()==='k'){e.preventDefault();if(!editor.open)searchDialog();}
    if(e.key==='Escape')closeSidebar();
    if(editor.open&&['problem','topic'].includes(editorType)&&modifier&&e.key==='Enter'){e.preventDefault();editor.querySelector('form').requestSubmit();return;}
    if(e.target.id==='note-body'){
      if(modifier&&e.key.toLowerCase()==='b'){e.preventDefault();insertNoteFormat('bold');}
      if(e.key==='Tab'){e.preventDefault();const area=e.target,start=area.selectionStart,end=area.selectionEnd;
        if(e.shiftKey){const line=area.value.lastIndexOf('\n',start-1)+1,spaces=area.value.slice(line,start).match(/^ {1,4}/)?.[0].length||0;if(spaces){area.setRangeText('',line,line+spaces,'preserve');editorDirty=true;}}
        else{area.setRangeText('    ',start,end,'end');editorDirty=true;}
      }
    }
  });
  $('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>25*1024*1024){toast('Choose a JSON file smaller than 25 MB.');return;}try{const imported=validateState(JSON.parse(await file.text()));pendingImport=imported;confirmDialog('Import backup?',`Replace the current ${state.problems.length} problem notes and ${state.topics.length} topics with ${imported.problems.length} problem notes and ${imported.topics.length} topics from the backup? Export your current notes first if you need to keep them.`,'Import',()=>{recoveryRaw='';if(save(pendingImport)){filters={query:'',topic:'',difficulty:'',sort:'recent'};topicTab='note';closeDialog(true);go('problems');render();toast('Backup imported.');}pendingImport=null;});}catch(e){toast('Import failed: '+e.message);}});
  window.addEventListener('hashchange',()=>{topicTab='note';render();window.scrollTo(0,0);});
  window.addEventListener('beforeunload',e=>{if(editorDirty||!storageAvailable){e.preventDefault();e.returnValue='';}});
  window.addEventListener('storage',e=>{if(e.key===storageKey){storageConflict=true;toast('Notes changed in another tab. Copy any unsaved text, then reload this page.');}});
  render();
})();

</script>
</body>
</html>
