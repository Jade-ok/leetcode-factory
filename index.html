    topicSeed("arrays","Arrays & Hashing","[ ]",[],"Use arrays for indexed sequences and hash maps for fast lookups. Store what you have already seen while scanning the input.","- Count frequencies or detect duplicates.\n- Find pairs through their complement.\n- Trade extra space for fewer repeated scans.","def two_sum(nums, target):\n    seen = {}\n    for i, num in enumerate(nums):\n        complement = target - num\n        if complement in seen:\n            return [seen[complement], i]\n        seen[num] = i\n    return []","- Check for a complement before storing the current value.\n- Hash lookups take O(1) time on average.\n- Check whether the original order matters."),

    topicSeed("stack","Stack","≡",["arrays"],"A stack processes the most recently added item first. Keep unresolved items until a new value lets you resolve them.","- Match brackets or nested structures.\n- Find the next greater or smaller value.\n- Return to a previous state.","def next_greater(nums):\n    result = [-1] * len(nums)\n    stack = []  # Unresolved indices\n    for i, num in enumerate(nums):\n        while stack and nums[stack[-1]] < num:\n            result[stack.pop()] = num\n        stack.append(i)\n    return result","- Check that the stack is not empty before popping.\n- Decide whether to store indices or values.\n- In a monotonic stack, each item is pushed and popped at most once."),
    topicSeed("binary-search","Binary Search","÷",["arrays"],"Repeatedly halve a sorted search space or a range with a monotonic condition. Keep the meaning of both boundaries consistent.","- Search sorted data.\n- Find the first position satisfying a condition.\n- Search for the smallest feasible answer.","def lower_bound(nums, target):\n    left, right = 0, len(nums)  # [left, right)\n    while left < right:\n        mid = (left + right) // 2\n        if nums[mid] < target:\n            left = mid + 1\n        else:\n            right = mid\n    return left","- Do not mix inclusive and exclusive boundaries.\n- A lower-bound result can equal len(nums).\n- Test empty arrays and single-element arrays."),
    topicSeed("sliding-window","Sliding Window","▭",["two-pointers"],"Maintain information about a contiguous range as its boundaries move. Add the entering item and remove the departing item.","- Work with contiguous subarrays or substrings.\n- Extend a range and restore a valid condition by shrinking it.","def longest_unique(s):\n    seen = set()\n    left = best = 0\n    for right, char in enumerate(s):\n        while char in seen:\n            seen.remove(s[left])\n            left += 1\n        seen.add(char)\n        best = max(best, right - left + 1)\n    return best","- The length of an inclusive window is right - left + 1.\n- Restoring a condition may need while rather than if.\n- Negative values can break sum-based monotonicity."),
    topicSeed("linked-list","Linked List","⊷",["two-pointers"],"Nodes are connected by references. Save the next reference before changing a link.","- Reverse or rearrange node connections.\n- Use fast and slow pointers for a midpoint or cycle.","def reverse_list(head):\n    prev, curr = None, head\n    while curr:\n        nxt = curr.next\n        curr.next = prev\n        prev, curr = curr, nxt\n    return prev","- Handle an empty head.\n- Save the next node before replacing its link.\n- A dummy node can simplify changes to the head."),
    topicSeed("trees","Trees","⋔",["stack", "binary-search"],"Each subtree has the same structure as the whole tree. Define what a recursive call returns before combining its results.","- Process parent-child relationships.\n- Combine results from smaller subtrees.\n- Traverse a hierarchy with DFS or BFS.","def max_depth(root):\n    if root is None:\n        return 0\n    left = max_depth(root.left)\n    right = max_depth(root.right)\n    return 1 + max(left, right)","- Define the return value for an empty node.\n- A skewed tree can require O(n) recursion depth.\n- BST ordering does not apply to every binary tree."),

    topicSeed("backtracking","Backtracking","⋈",["trees"],"Choose, explore, and undo to build possible solutions. Copy a path when saving it as an answer.","- Generate combinations, permutations, or subsets.\n- Prune choices that already violate a condition.","def subsets(nums):\n    result, path = [], []\n    def dfs(start):\n        result.append(path.copy())\n        for i in range(start, len(nums)):\n            path.append(nums[i])\n            dfs(i + 1)\n            path.pop()\n    dfs(0)\n    return result","- Save a copy of the path, not the same mutable list.\n- Undo both the choice and any visited marker.\n- Handle duplicate input values deliberately."),
    topicSeed("tries","Tries","T",["trees"],"Share common prefixes between strings. Follow one character per edge and mark the end of each complete word.","- Repeat prefix queries.\n- Search many words through a shared structure.","class Trie:\n    def __init__(self):\n        self.root = {}\n\n    def insert(self, word):\n        node = self.root\n        for char in word:\n            node = node.setdefault(char, {})\n        node[\"#\"] = True\n\n    def search(self, word):\n        node = self.root\n        for char in word:\n            if char not in node:\n                return False\n            node = node[char]\n        return \"#\" in node","- Distinguish a complete word from a prefix.\n- Use an end marker outside the input alphabet.\n- Decide whether empty strings are supported."),

    topicSeed("dp-1d","1-D Dynamic Programming","ƒ",["backtracking"],"Reuse the answers to overlapping subproblems. Write down the meaning of a state, the transition, the base cases, and the evaluation order.","- The same states appear repeatedly.\n- Earlier results determine a count or an optimal value.","def climb_stairs(n):\n    if n <= 2:\n        return n\n    prev2, prev1 = 1, 2\n    for step in range(3, n + 1):\n        prev2, prev1 = prev1, prev1 + prev2\n    return prev1  # n >= 1","- Define dp[i] in one sentence.\n- Verify base cases with small inputs.\n- Understand the array version before optimizing space."),
    topicSeed("advanced-graphs","Advanced Graphs","◇",["graphs", "heap"],"Choose an algorithm based on weights and ordering constraints: shortest paths, topological sorting, or disjoint sets.","- Nonnegative weighted shortest paths: Dijkstra.\n- Prerequisite ordering: topological sort.\n- Repeated connectivity queries: union-find.","import heapq\n\ndef dijkstra(graph, start):\n    dist, heap = {start: 0}, [(0, start)]\n    while heap:\n        cost, node = heapq.heappop(heap)\n        if cost > dist[node]:\n            continue\n        for nxt, weight in graph.get(node, []):\n            new_cost = cost + weight\n            if new_cost < dist.get(nxt, float(\"inf\")):\n                dist[nxt] = new_cost\n                heapq.heappush(heap, (new_cost, nxt))\n    return dist","- Dijkstra does not support negative edges.\n- Skip outdated heap entries.\n- Define how unreachable vertices are represented."),
    topicSeed("dp-2d","2-D Dynamic Programming","▦",["dp-1d", "graphs"],"Use two indices or two state dimensions to define a subproblem. Evaluate each state after the states it depends on.","- Compare two strings or sequences.\n- Count grid paths.\n- Model choices with two dimensions, such as capacity and item index.","def unique_paths(rows, cols):\n    if rows <= 0 or cols <= 0:\n        return 0\n    dp = [[1] * cols for _ in range(rows)]\n    for r in range(1, rows):\n        for c in range(1, cols):\n            dp[r][c] = dp[r-1][c] + dp[r][c-1]\n    return dp[-1][-1]","- [[0] * cols] * rows shares row references.\n- Follow transition dependencies when ordering loops.\n- Check the initial row and column."),
    topicSeed("greedy","Greedy","↗",["dp-1d"],"Commit to a local choice when you can prove it leads to an optimal result. Look for an exchange argument or an invariant.","- Sorting makes a choice safe to finalize.\n- A local choice preserves future possibilities.","def can_jump(nums):\n    farthest = 0\n    for i, jump in enumerate(nums):\n        if i > farthest:\n            return False\n        farthest = max(farthest, i + jump)\n        if farthest >= len(nums) - 1:\n            return True\n    return not nums","- A plausible rule still needs a proof.\n- Look for small counterexamples.\n- Specify the sort order and tie handling."),
    topicSeed("intervals","Intervals","⊏",["greedy"],"Sort interval endpoints and compare overlaps. Define whether intervals sharing an endpoint overlap.","- Merge ranges.\n- Schedule meetings.\n- Detect overlap after sorting.","def merge_intervals(intervals):\n    merged = []\n    for start, end in sorted(intervals):\n        if merged and start <= merged[-1][1]:\n            merged[-1][1] = max(merged[-1][1], end)\n        else:\n            merged.append([start, end])\n    return merged","- Distinguish closed and half-open intervals.\n- Merging and selecting intervals can need different sort orders.\n- Check whether changing the input is allowed."),
    topicSeed("bit","Bit Manipulation","01",["dp-1d"],"Treat an integer as a collection of binary states. Connect XOR, AND, and shift operations to the problem constraints.","- Cancel matching pairs with XOR.\n- Count or inspect set bits.\n- Represent subsets with bit masks.","def count_bits(n):\n    if n < 0:\n        raise ValueError(\"n must be non-negative\")\n    count = 0\n    while n:\n        n &= n - 1  # Clear the lowest set bit\n        count += 1\n    return count","- Python negative integers behave differently from fixed-width integers.\n- Remember a ^ a = 0 and a ^ 0 = a.\n- Use parentheses to make precedence explicit."),

  function insertNoteFormat(kind){

      const runs=selected.match(/`+/g)||[],fence='`'.repeat(runs.reduce((n,s)=>Math.max(n,s.length+1),3));

      const after=end<area.value.length?(area.value.slice(end).startsWith('\n\n')?'':area.value[end]==='\n'?'\n':'\n\n'):'\n\n';
      const prefix=before+fence+languageId(language)+'\n';replacement=prefix+selected+'\n'+fence+after;caret=prefix.length;
    }else if(kind==='bold'){replacement='**'+selected+'**';caret=2;}

  }
  async function copyCode(el){const text=el.closest('.code-box').querySelector('code').textContent;try{if(navigator.clipboard&&globalThis.isSecureContext)await navigator.clipboard.writeText(text);else {const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;opacity:0';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw Error('copy');}toast('Code copied.');}catch{toast('Copy is unavailable. Select the code and copy it manually.');}}
  function searchDialog(){searchQuery='';openDialog(`${dialogHeader('Search')}<input id="global-query" class="search-dialog-input" type="search" placeholder="Search problems and topics" aria-label="Search notes" autofocus><div id="global-results" class="search-results" aria-live="polite"></div>`,'search');updateSearch();}
  function updateSearch(){const q=searchQuery.trim().toLowerCase(),problems=state.problems.filter(p=>matches(p,q)),topics=state.topics.filter(t=>(t.name+' '+t.body).toLowerCase().includes(q));const results=[...problems.map(p=>({title:(p.number?p.number+'. ':'')+p.title,sub:'Problem · '+(p.topics.map(t=>topicById(t)?.name).join(', ')||'Uncategorized'),path:'problem/'+p.id})),...topics.map(t=>({title:t.name,sub:'Master note · '+problemsFor(t.id).length+' problems',path:'topic/'+t.id}))].slice(0,40);$('#global-results').innerHTML=!q?empty('Search your notes','Enter a title, problem number, or a phrase from your notes.'):results.length?results.map(r=>`<button class="search-result" data-action="search-go" data-path="${esc(r.path)}"><strong>${esc(r.title)}</strong><small>${esc(r.sub)}</small></button>`).join(''):empty('No results','Try a different search.');}
  function closeSidebar(){$('.sidebar')?.classList.remove('open');$('.mobile-overlay')?.classList.remove('open');}
  document.addEventListener('click',e=>{
    const format=e.target.closest('[data-edit]');if(format){insertNoteFormat(format.dataset.edit);return;}
    const scroll=e.target.closest('[data-scroll]');if(scroll){e.preventDefault();document.getElementById(scroll.dataset.scroll)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});return;}
    if(e.target.closest('.side-topic,.nav-link,.brand'))closeSidebar();
    const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,r=route();
    switch(action){
      case'add-problem':problemEditor();break;case'add-problem-topic':problemEditor('',r.id);break;case'edit-problem':problemEditor(r.id);break;
      case'add-topic':topicEditor();break;case'edit-topic':topicEditor(r.id);break;case'close-dialog':closeDialog();break;
      case'topic-note':topicTab='note';render();break;case'topic-problems':topicTab='problems';render();break;
      case'note-write':noteMode(false);break;case'note-preview':noteMode(true);break;
      case'copy-code':copyCode(el);break;case'backup':backupDialog();break;case'export-json':exportJSON();break;case'export-html':exportHTML();break;case'import-json':$('#import-file').click();break;
      case'clear-filters':filters={query:'',topic:'',difficulty:'',sort:'recent'};render();break;
      case'search':searchDialog();break;case'search-go':closeDialog(true);topicTab='note';go(el.dataset.path);break;
      case'delete-problem':confirmDialog('Delete problem note?','This removes the note and its content. Export a backup first if you want to keep a copy.','Delete',()=>{if(mutate(s=>s.problems=s.problems.filter(p=>p.id!==r.id))){go('problems');toast('Problem note deleted.');}},true);break;
      case'download-recovery':download(recoveryRaw,'application/json','leetcode-notes-recovery-'+today()+'.json');confirmDialog('Start with empty notes?','The original data has been downloaded. Keep that file before starting with empty notes.','Start over',()=>{recoveryRaw='';save(freshState());closeDialog(true);go('problems');render();});break;
      case'print':window.print();break;case'menu':$('.sidebar').classList.add('open');$('.mobile-overlay').classList.add('open');break;case'close-menu':closeSidebar();break;
    }
  });
  document.addEventListener('input',e=>{const el=e.target;if(editor.contains(el)&&editorType!=='search')editorDirty=true;if(el.id==='problem-query'){filters.query=el.value;updateProblemResults();}if(el.id==='topic-query'){topicQuery=el.value;updateTopics();}if(el.id==='global-query'){searchQuery=el.value;updateSearch();}});
  document.addEventListener('change',e=>{const el=e.target,keys={'filter-topic':'topic','filter-difficulty':'difficulty','filter-sort':'sort'};if(keys[el.id]){filters[keys[el.id]]=el.value;updateProblemResults();}});
  document.addEventListener('submit',e=>{if(e.target.id==='problem-form'){e.preventDefault();saveProblem(e.target);}if(e.target.id==='topic-form'){e.preventDefault();saveTopic(e.target);}});
  editor.addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
  document.addEventListener('keydown',e=>{
    const modifier=e.metaKey||e.ctrlKey;
    if(modifier&&e.key.toLowerCase()==='k'){e.preventDefault();if(!editor.open)searchDialog();}
    if(e.key==='Escape')closeSidebar();
    if(editor.open&&['problem','topic'].includes(editorType)&&modifier&&e.key==='Enter'){e.preventDefault();editor.querySelector('form').requestSubmit();return;}
    if(e.target.id==='note-body'){
      if(modifier&&e.key.toLowerCase()==='b'){e.preventDefault();insertNoteFormat('bold');}
      if(e.key==='Tab'){e.preventDefault();const area=e.target,start=area.selectionStart,end=area.selectionEnd;
        if(e.shiftKey){const line=area.value.lastIndexOf('\n',start-1)+1,spaces=area.value.slice(line,start).match(/^ {1,4}/)?.[0].length||0;if(spaces){area.setRangeText('',line,line+spaces,'preserve');editorDirty=true;}}
        else{area.setRangeText('    ',start,end,'end');editorDirty=true;}
      }
    }
  });
  $('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>25*1024*1024){toast('Choose a JSON file smaller than 25 MB.');return;}try{const imported=validateState(JSON.parse(await file.text()));pendingImport=imported;confirmDialog('Import backup?',`Replace the current ${state.problems.length} problem notes and ${state.topics.length} topics with ${imported.problems.length} problem notes and ${imported.topics.length} topics from the backup? Export your current notes first if you need to keep them.`,'Import',()=>{recoveryRaw='';if(save(pendingImport)){filters={query:'',topic:'',difficulty:'',sort:'recent'};topicTab='note';closeDialog(true);go('problems');render();toast('Backup imported.');}pendingImport=null;});}catch(e){toast('Import failed: '+e.message);}});
  window.addEventListener('hashchange',()=>{topicTab='note';render();window.scrollTo(0,0);});
  window.addEventListener('beforeunload',e=>{if(editorDirty||!storageAvailable){e.preventDefault();e.returnValue='';}});
  window.addEventListener('storage',e=>{if(e.key===storageKey){storageConflict=true;toast('Notes changed in another tab. Copy any unsaved text, then reload this page.');}});
  render();
})();

</script>
</body>
</html>
